<title>TradeSentinel Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: a white top bar, three summary cards, then two lanes split by who must act next. One issue opens as plain steps beside a short summary card. */
:root{--bg:#f4f6fa;--card:#fff;--bar:#fff;--ink:#16213a;--muted:#56627d;--faint:#8590a8;--line:#e2e6ef;--navy:#1f3864;--navy-ink:#fff;--accent:#8b1e3f;--soft:#eef1f8;
--team:#1f3864;--team-soft:#e8edf7;--client:#8a5a00;--client-soft:#fbf2df;--done:#16704a;--done-soft:#e4f3eb;
--s1:#b3123a;--s1b:#fde8ed;--s2:#b4500c;--s2b:#fdeee3;--s3:#7a6300;--s3b:#faf4d9;--s4:#46617f;--s4b:#e9eff6;
--shadow:0 1px 2px rgba(22,33,58,.06),0 4px 14px rgba(22,33,58,.05);
--sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--serif:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1527;--card:#172038;--bar:#131b30;--ink:#e7ecf6;--muted:#a3aec6;--faint:#7d88a4;--line:#28334e;--navy:#93b2ec;--navy-ink:#0f1527;--accent:#f08cab;--soft:#202b47;--team:#93b2ec;--team-soft:#1e2a48;--client:#f0c56a;--client-soft:#2d2714;--done:#5cd19c;--done-soft:#163226;--s1:#ff7896;--s1b:#3a1822;--s2:#ffa565;--s2b:#3a2416;--s3:#e8cc5a;--s3b:#332c12;--s4:#a5bfdc;--s4b:#1f2b40;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1527;--card:#172038;--bar:#131b30;--ink:#e7ecf6;--muted:#a3aec6;--faint:#7d88a4;--line:#28334e;--navy:#93b2ec;--navy-ink:#0f1527;--accent:#f08cab;--soft:#202b47;--team:#93b2ec;--team-soft:#1e2a48;--client:#f0c56a;--client-soft:#2d2714;--done:#5cd19c;--done-soft:#163226;--s1:#ff7896;--s1b:#3a1822;--s2:#ffa565;--s2b:#3a2416;--s3:#e8cc5a;--s3b:#332c12;--s4:#a5bfdc;--s4b:#1f2b40;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);margin:0;padding-block:0 56px}
.bar{background:var(--bar);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.inner{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.bar .inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font:600 20px var(--serif);color:var(--ink)}
.mark{width:30px;height:30px;border-radius:8px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font:600 13px var(--sans);letter-spacing:.03em}
nav{display:flex;gap:4px}
nav button{background:none;border:0;border-radius:8px;padding:7px 14px;font:500 14px var(--sans);color:var(--muted);cursor:pointer}
nav button:hover{background:var(--soft)}
nav button[aria-selected=true]{background:var(--team-soft);color:var(--navy)}
.grow{flex:1}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--faint);margin:18px 0 22px}
h1{font:600 26px/1.25 var(--serif);margin:0;text-wrap:balance}
h2{font:600 18px var(--serif);margin:0;text-wrap:balance}
h3{font:600 16px var(--sans);margin:0}
p{margin:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
@media(max-width:600px){.counts{grid-template-columns:minmax(0,1fr)}}
.count{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.count b{font:600 32px/1 var(--serif);font-variant-numeric:tabular-nums}
.count span{font-size:14px;color:var(--muted);line-height:1.3}
.count.team b{color:var(--team)}.count.client b{color:var(--client)}.count.done b{color:var(--done)}
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
@media(max-width:860px){.lanes{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}
.lane-head{display:flex;align-items:center;gap:10px}
.badge{font:600 12px var(--sans);border-radius:20px;padding:2px 9px}
.lane.team .badge{background:var(--team-soft);color:var(--team)}.lane.client .badge{background:var(--client-soft);color:var(--client)}
.lane-sub{font-size:13px;color:var(--muted);margin:4px 0 14px}
.list{display:flex;flex-direction:column;gap:10px}
.issue{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid transparent;border-radius:12px;padding:12px 14px;cursor:pointer;color:inherit;font:inherit;transition:border-color .15s,transform .15s}
.issue:hover{border-color:var(--line);transform:translateY(-1px)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--sans);background:var(--team-soft);color:var(--team)}
.lane.client .avatar{background:var(--client-soft);color:var(--client)}
.issue .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.issue .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.issue .who{font-weight:600}
.issue .when{margin-left:auto;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.issue .text{color:var(--muted);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wait{font-size:13px;color:var(--client)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--faint);text-align:center;font-size:14px}
.pill{display:inline-block;font:600 12px var(--sans);padding:2px 9px;border-radius:20px;white-space:nowrap}
.S1{color:var(--s1);background:var(--s1b)}.S2{color:var(--s2);background:var(--s2b)}.S3{color:var(--s3);background:var(--s3b)}.S4{color:var(--s4);background:var(--s4b)}
.tag{font-size:12px;color:var(--muted);background:var(--soft);border-radius:20px;padding:1px 9px;white-space:nowrap}
.tag.sme{color:var(--accent);background:var(--s1b)}
details{margin-top:2px}
summary{cursor:pointer;color:var(--navy);font-weight:500;font-size:14px}
.extra{margin-top:24px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
textarea,select,input[type=text],input[type=time]{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
button.primary,button.ghost{font:500 14px var(--sans);border-radius:10px;padding:9px 18px;cursor:pointer}
button.primary{background:var(--navy);color:var(--navy-ink);border:1px solid var(--navy)}
button.ghost{background:var(--card);color:var(--navy);border:1px solid var(--line)}
button.link{background:none;border:0;color:var(--navy);font:500 13px var(--sans);cursor:pointer;padding:0;text-decoration:underline}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.issue:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{background:none;border:0;color:var(--navy);font:500 14px var(--sans);cursor:pointer;padding:0;margin:20px 0 16px}
.issue-page{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media(max-width:900px){.issue-page{grid-template-columns:minmax(0,1fr)}.side{order:-1}}
.quote{font:400 19px/1.5 var(--serif);margin:12px 0 0}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;margin-top:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side .card{margin-top:0;position:sticky;top:84px;gap:10px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px;margin:0}
.facts dt{color:var(--faint)}.facts dd{margin:0}
.step{display:flex;align-items:center;gap:10px}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--sans);background:var(--team-soft);color:var(--navy);flex:none}
.step .n.done{background:var(--done-soft);color:var(--done)}
.read{font-size:16px;line-height:1.6}
.sme-box{background:var(--s1b);color:var(--s1);border-radius:12px;padding:12px 14px;font-size:14px}
.okmsg{color:var(--done);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.trail{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.cause{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.cause.sel{border-color:var(--done);background:var(--done-soft)}
.cause input{margin-top:4px}
.ev{font-size:13px;color:var(--muted)}
.fixbox{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.waitbox{background:var(--client-soft);color:var(--client);border-radius:12px;padding:12px 14px;font-size:14px}
.hint{font-size:13px;color:var(--faint)}
.hint.block{color:var(--client)}
.draft{background:var(--soft);border-radius:12px;padding:14px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.log{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px}
td{border-bottom:1px solid var(--line);padding:10px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:18px}
.tile{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
.tile b{display:block;font:600 28px var(--serif);color:var(--navy)}
.tile span{font-size:13px;color:var(--muted)}
.narrow{max-width:900px}
pre{font-size:12px;overflow:auto;background:var(--soft);padding:12px;border-radius:10px;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.issue{transition:none}.issue:hover{transform:none}}
</style>
<div class="bar"><div class="inner">
  <div class="brand"><span class="mark">TS</span>TradeSentinel</div>
  <nav role="tablist" id="nav"></nav>
  <div class="grow"></div>
  <label class="switch"><input type="checkbox" id="mh" checked> Market open</label>
</div></div>
<div class="inner">
<p class="note">Demo with made-up data. It is not connected to any real system.</p>
<main id="view"></main>
</div>
<script>__ENGINE__</script>
<script>
const RAW=__DATA__, E=TradeSentinelEngine, D=E.parseData(RAW), HOLD=__EVAL__;
const cfg=__CONFIG__, runbooks=__RUNBOOKS__, PAPER=__PAPER__;
const eng=E.create({config:cfg,train:D.train,incidents:D.incidents,deployments:D.deployments,runbooks,temperature:HOLD.temperature});
const FIX_TEAM=cfg.fix_team||'Development team';
const LEVEL={L0:'Learning only',L1:'Suggests',L2:'Pre-fills',L3:'Acts alone'};
const LEVEL_HELP={L0:'Suggestions are hidden while TradeSentinel learns.',L1:'TradeSentinel suggests a team. You choose.',L2:'TradeSentinel fills in the team. You check and approve.'};
const SEVNAME={S1:'Critical',S2:'High',S3:'Medium',S4:'Low'};
const STEPNAME={'Model proposal':'From the wording','Category floor':'Minimum for this type of issue','Uncertainty floor':'Not sure, so the safer choice','Security rule':'Possible security problem','Blast radius':'Many clients affected'};
const plainReason=r=>r.replace(/^low confidence \((\d+%)\)$/,'TradeSentinel is not sure ($1)').replace('possible execution failure','it may be a failed trade').replace('possible security event','it may be an account security problem');
// Issues already waiting on the client when the demo opens.
const WITH_CLIENT={'T-1007':{owner:'Client Service Desk',cause:0,waiting:'We sent the guide. Waiting for the client to confirm it helped.',since:'10:40'},
  'T-1008':{owner:'Post-Trade Engineering',cause:null,waiting:'We asked the client for the order number and contract note.',since:'10:52'},
  'T-1011':{owner:'Connectivity Support',cause:0,waiting:'Connection reset done. Waiting for the client to log in again and confirm.',since:'11:55'}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=x=>Math.round(x*100)+'%';
const pill=s=>`<span class="pill ${s}">${s} ${SEVNAME[s]}</span>`;
const initials=n=>n.split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const BLANK=/\[[A-Z ]+:[^\]]*\]/g;
const blank=()=>({opened:null,lane:'team',routed:false,owner:null,override:null,merge:false,cause:null,fix:false,next:'',reply:null,edited:false,sent:false,everSent:false,closed:false,waiting:'',since:''});
const S={tab:'issues',sel:null,audit:[],n:1013,tickets:D.demo.map(t=>{const st=blank(),w=WITH_CLIENT[t.id];if(w)Object.assign(st,{lane:'client',routed:true,owner:w.owner,cause:w.cause,sent:true,everSent:true,waiting:w.waiting,since:w.since});return {...t,st}})};
function log(m){S.audit.unshift(new Date().toTimeString().slice(0,5)+'  '+m)}
function recompute(){
  const mh=document.getElementById('mh').checked;
  S.tickets.forEach(t=>{t.marketHours=mh;t.triage=eng.triage(t)});
  eng.cluster(S.tickets).forEach(g=>g.members.forEach(m=>{const t=S.tickets[m],b=eng.applyBlastRadius(t.triage.severity,g.members.length,t.marketHours);
    t.reports=g.members.length;t.peers=g.members.map(x=>S.tickets[x].id);t.fullTrail=t.triage.trail.concat(b.steps);t.sev=t.humanSev||b.severity}));
}
const cur=()=>S.tickets.find(t=>t.id===S.sel);
const needsSME=t=>t.st.lane==='team'&&(t.triage.senior||t.sev==='S1');
function nav(){document.getElementById('nav').innerHTML=[['issues','Issues'],['rules','Rules'],['results','Results']].map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k&&!S.sel}" data-tab="${k}">${l}</button>`).join('')}
function card(t){
  const tags=[];
  if(t.reports>1)tags.push(`<span class="tag">${t.reports} messages</span>`);
  if(needsSME(t))tags.push('<span class="tag sme">SME check</span>');
  return `<button class="issue" data-t="${t.id}"><span class="avatar" aria-hidden="true">${esc(initials(t.client))}</span><span class="body"><span class="top">${pill(t.sev)}<span class="who">${esc(t.client)}</span><span class="when">${t.st.lane==='client'?'since '+esc(t.st.since):esc(t.time)}</span></span>
  <span class="text">${esc(t.text)}</span>${tags.length?`<span class="top">${tags.join('')}</span>`:''}${t.st.lane==='client'?`<span class="wait">${esc(t.st.waiting)}</span>`:''}</span></button>`;
}
function home(){
  const by=l=>S.tickets.filter(t=>t.st.lane===l).sort((a,b)=>E.RANK[b.sev]-E.RANK[a.sev]||a.minute-b.minute);
  const team=by('team'),client=by('client'),done=by('closed');
  return `<div class="counts"><div class="count team"><b>${team.length}</b><span>With your team</span></div><div class="count client"><b>${client.length}</b><span>With the client</span></div><div class="count done"><b>${done.length}</b><span>Closed today</span></div></div>
  <div class="lanes">
   <section class="lane team"><div class="lane-head"><h2>With your team</h2><span class="badge">${team.length}</span></div><p class="lane-sub">Your team needs to act. Most urgent at the top.</p><div class="list">${team.map(card).join('')||'<div class="empty">Nothing is waiting on your team.</div>'}</div></section>
   <section class="lane client"><div class="lane-head"><h2>With the client</h2><span class="badge">${client.length}</span></div><p class="lane-sub">We have replied. Waiting for the client to answer or confirm.</p><div class="list">${client.map(card).join('')||'<div class="empty">Nothing is waiting on clients.</div>'}</div></section>
  </div>
  ${done.length?`<details class="extra"><summary>Closed today (${done.length})</summary><div class="list" style="margin-top:12px">${done.map(card).join('')}</div></details>`:''}
  <details class="extra" id="tryown"><summary>Try your own message</summary><label class="small muted" for="newt" style="display:block;margin:10px 0 8px">Type a message as a client would, and see how TradeSentinel handles it.</label><textarea id="newt" placeholder="e.g. my sell order went through but nothing shows at the exchange"></textarea><div style="margin-top:10px"><button class="ghost" id="add">Check this message</button></div></details>`;
}
function reading(t){
  const r=t.triage,c=cfg.categories[r.category],last=t.fullTrail[t.fullTrail.length-1];
  const because=last.step==='Blast radius'?`${t.reports} clients are reporting the same problem`:last.step==='Model proposal'?'of how the message is worded':last.step==='Category floor'?`this type of issue is never lower than ${last.sev} ${t.marketHours?'while the market is open':'after hours'}`:last.step==='Uncertainty floor'?`it might also be "${last.why.match(/Could be (.+?) \(/)?.[1]||'something more serious'}", so the safer priority is used`:'the message mentions a possible security problem';
  return `<h3>What TradeSentinel thinks</h3>
  <p class="read">This looks like <b>${esc(c.label.toLowerCase())}</b>. TradeSentinel is ${pc(r.confidence)} sure.<br>Priority is <b>${t.sev} ${SEVNAME[t.sev]}</b> because ${esc(because)}.</p>
  <details><summary>Why this priority?</summary><ol class="trail">${t.fullTrail.map(s=>`<li>${pill(s.sev)} <b>${esc(STEPNAME[s.step]||s.step)}:</b> ${esc(s.why)}</li>`).join('')}</ol>
  <p class="small muted" style="margin-top:10px">It could also be: ${r.alternatives.map(a=>esc(cfg.categories[a.label].label)+' ('+pc(a.p)+')').join(', ')}. TradeSentinel can raise a priority, but only a person can lower it.</p></details>`;
}
function stepTeam(t){
  const r=t.triage,c=cfg.categories[r.category],lvl=c.level,st=t.st,pre=lvl==='L2';
  const owners=[...new Set(Object.values(cfg.categories).map(x=>x.owner).concat([cfg.security_rule.route]))];
  const head=`<div class="step"><span class="n ${st.routed?'done':''}">1</span><h3>Choose the team</h3><span class="grow"></span><span class="tag" title="${esc(LEVEL_HELP[lvl]||'')}">TradeSentinel ${LEVEL[lvl].toLowerCase()}</span></div>`;
  if(st.routed)return `<section class="card">${head}<p class="okmsg">Sent to ${esc(st.owner)}${st.override?` <span class="muted">(changed: ${esc(st.override)})</span>`:''}</p></section>`;
  return `<section class="card">${head}
  <p class="small muted">${esc(LEVEL_HELP[lvl]||'')}${c.held_reason?' For failed trades it only suggests, because a mistake here costs the most.':''}</p>
  <div class="row"><label class="field">Team<select id="owner">${pre?'':'<option value="">Choose a team</option>'}${owners.map(o=>`<option ${pre&&o===r.owner?'selected':''}>${esc(o)}</option>`).join('')}</select></label>
  <label class="field">Priority<select id="sev">${['S1','S2','S3','S4'].map(s=>`<option value="${s}" ${s===t.sev?'selected':''}>${s} ${SEVNAME[s]}</option>`).join('')}</select></label></div>
  ${lvl!=='L0'&&!pre?`<p class="small muted">Suggested team: <b>${esc(r.owner)}</b></p>`:''}
  <label class="field">If you change anything, say why<input type="text" id="why" placeholder="e.g. the client confirmed it is only one order"></label>
  <p id="err" class="small" style="color:var(--s1)" hidden></p>
  <div><button class="primary" id="route">${pre?'Approve':'Send to this team'}</button></div></section>`;
}
function stepCause(t){
  const st=t.st,head=`<div class="step"><span class="n ${st.cause!==null?'done':''}">2</span><h3>Find the cause</h3></div>`;
  if(!st.routed)return `<section class="card">${head}<p class="faint">Opens once a team is chosen.</p></section>`;
  const hs=eng.hypotheses(t.text,t.triage.category,t.minute),conf=st.cause!==null?hs[st.cause]:null;
  return `<section class="card">${head}<p class="small muted">Possible causes, based on past incidents and recent system changes. Pick the one the evidence supports.</p>
  ${hs.map((h,i)=>`<label class="cause ${st.cause===i?'sel':''}"><input type="radio" name="cause" data-cause="${i}" ${st.cause===i?'checked':''}><span><b>${esc(h.summary)}</b><br><span class="ev">Based on: ${h.evidence.map(e=>esc(e.id)).join(', ')}</span></span></label>`).join('')}
  ${conf?`<div class="fixbox"><span><b>Suggested fix:</b> ${esc(conf.fix)}</span>${st.fix?`<span class="okmsg">Assigned to the ${esc(FIX_TEAM.toLowerCase())}. They apply it through the normal change process.</span>`:`<div><button class="ghost" id="fix">Assign fix to the ${esc(FIX_TEAM.toLowerCase())}</button></div>`}</div>`:''}
  <details><summary>Checklist for this type of issue</summary><ol class="trail">${runbooks[t.triage.category].map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details></section>`;
}
function suggested(t){
  const hs=eng.hypotheses(t.text,t.triage.category,t.minute),conf=t.st.cause!==null?hs[t.st.cause]:null;
  const dr=eng.draftUpdate({reports:t.reports,severity:t.sev,category:t.triage.category,confirmed:conf,startedAt:t.time,approved:true});
  return t.st.next?dr.text.replace(/\[NEXT UPDATE TIME:[^\]]*\]/,'Next update by '+t.st.next+'.'):dr.text;
}
function replyText(t){return t.st.edited&&t.st.reply!==null?t.st.reply:suggested(t)}
function replyHint(text){const n=(text.match(BLANK)||[]).length;if(!text.trim())return 'The reply is empty.';return n?`Fill in or remove the ${n} part${n>1?'s':''} in [square brackets] first. TradeSentinel never guesses them.`:''}
function stepReply(t){
  const st=t.st,head=`<div class="step"><span class="n ${st.everSent?'done':''}">3</span><h3>Reply to the client</h3></div>`;
  if(!st.routed)return `<section class="card">${head}<p class="faint">Opens once a team is chosen.</p></section>`;
  const hs=eng.hypotheses(t.text,t.triage.category,t.minute),conf=st.cause!==null?hs[st.cause]:null;
  if(st.lane==='client')return `<section class="card">${head}<p class="waitbox">${esc(st.waiting)} Since ${esc(st.since)}.</p>
   <div class="row"><button class="ghost" id="replied">The client answered</button><button class="primary" id="close" ${conf?'':'disabled'}>Close issue</button></div>${conf?'':'<p class="hint">You can close it once the cause is confirmed.</p>'}</section>`;
  if(st.lane==='closed')return `<section class="card">${head}<p class="okmsg">Closed.</p><div class="draft">${esc(eng.closureNote({category:t.triage.category,confirmed:conf,severity:t.sev,reports:t.reports}))}</div></section>`;
  const text=replyText(t),hint=replyHint(text);
  return `<section class="card">${head}<p class="small muted">TradeSentinel wrote a first draft. Edit it as you like before sending.</p>
  <textarea id="reply" rows="5" aria-label="Reply to the client">${esc(text)}</textarea>
  <div class="row"><label class="field">Next update by<input type="time" id="next" value="${esc(st.next)}"></label>${st.edited?'<button class="link" id="resetreply">Go back to the suggested draft</button>':''}<span class="grow"></span><button class="primary" id="send" ${hint?'disabled':''}>Send reply</button></div>
  <p class="hint ${hint?'block':''}" id="replyhint">${hint||'Sending moves this issue to "With the client". You are responsible for what you send.'}</p></section>`;
}
function detail(){
  const t=cur();if(!t.st.opened)t.st.opened=Date.now();
  const r=t.triage,lane=t.st.lane==='client'?'With the client':t.st.lane==='closed'?'Closed':'With your team';
  return `<button class="back" data-home="1">&larr; Back to all issues</button>
  <div class="issue-page"><div style="min-width:0">
  <h1>${esc(t.client)}</h1><p class="quote">“${esc(t.text)}”</p>
  ${needsSME(t)?`<p class="sme-box" style="margin-top:16px"><b>Ask a subject matter expert (SME) to check this.</b> Reason: ${esc(r.seniorReasons.map(plainReason).concat(t.sev==='S1'?['critical priority']:[]).join('; '))}.</p>`:''}
  <section class="card">${cfg.categories[r.category].level==='L0'?'<p class="muted">TradeSentinel is only learning for this type of issue, so its view is hidden.</p>':reading(t)}
  ${t.reports>1?`<p class="small">${t.peers.length} messages look like the same problem (${t.peers.join(', ')}). ${t.st.merge?'<span class="okmsg">Combined.</span>':'<button class="ghost" id="merge">Combine them</button>'}</p>`:''}</section>
  ${stepTeam(t)}${stepCause(t)}${stepReply(t)}
  <details class="extra"><summary>History</summary><ul class="log">${S.audit.filter(a=>a.includes(t.id)).map(a=>`<li>${esc(a)}</li>`).join('')||'<li>Nothing done yet.</li>'}</ul></details></div>
  <aside class="side"><div class="card"><h3>About this issue</h3><dl class="facts"><dt>Priority</dt><dd>${pill(t.sev)}</dd><dt>Where it is</dt><dd>${lane}</dd><dt>Team</dt><dd>${esc(t.st.owner||'Not chosen yet')}</dd><dt>Received</dt><dd>${esc(t.time)} by ${esc(t.channel.toLowerCase())}</dd><dt>Reference</dt><dd>${t.id}</dd></dl>
  <p class="hint">TradeSentinel never lowers a priority, closes or combines issues, changes live systems, or replies to a client on its own.</p></div></aside></div>`;
}
function rules(){
  const rows=Object.entries(cfg.categories).map(([k,c])=>`<tr><td>${esc(c.label)}</td><td>${esc(c.owner)}</td><td>${pill(c.floor_market)}</td><td><select data-level="${k}" aria-label="What TradeSentinel may do for ${esc(c.label)}" ${c.held_reason?'disabled':''}>${['L0','L1','L2'].map(l=>`<option value="${l}" ${c.level===l?'selected':''}>${LEVEL[l]}</option>`).join('')}<option disabled>Acts alone (not allowed yet)</option></select></td></tr>`).join('');
  return `<div class="narrow"><h1>Rules</h1><p class="muted" style="margin-top:6px">Choose how much TradeSentinel may do for each type of issue. Change one, then open an issue to see the difference.</p>
  <section class="card"><div class="tw"><table><thead><tr><th>Type of issue</th><th>Team</th><th>Lowest priority while the market is open</th><th>TradeSentinel</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="hint">For failed trades it only suggests, on purpose, because a mistake there costs the most.</p>
  <label class="field">Ask an SME when TradeSentinel is less sure than <b id="thrv">${pc(cfg.confidence_threshold)}</b><input id="thr" type="range" min="0.3" max="0.9" step="0.05" value="${cfg.confidence_threshold}"></label></section>
  <details class="extra"><summary>Could this work for market data alerts? (paper test only)</summary><p class="small muted" style="margin-top:10px">Mostly yes: the same rules, steps and approvals carry over. Two engine changes are needed: grouping alerts by data feed, and counting affected clients.</p><pre>${esc(JSON.stringify(PAPER,null,2))}</pre></details></div>`;
}
function results(){
  const R=HOLD,tr=R.severity.table;
  return `<div class="narrow"><h1>Results</h1><p class="muted" style="margin-top:6px">How TradeSentinel did on ${R.n} made-up messages it had never seen.</p>
  <div class="tiles"><div class="tile"><b>${R.category.accuracy}%</b><span>understood correctly (simple keyword rules: ${R.category.baselineAccuracy}%)</span></div><div class="tile"><b>${tr[0].criticalRecall}%</b><span>of serious issues raised in time (AI without the rules: ${tr[1].criticalRecall}%)</span></div><div class="tile"><b>${R.rootCause.top3}%</b><span>had the real cause in its top three</span></div><div class="tile"><b>${R.severity.underS1S2.length}</b><span>serious issues given too low a priority</span></div></div>
  <section class="card"><h3>Where it went wrong</h3><div class="tw"><table><thead><tr><th>Message</th><th>Should be</th><th>Got</th></tr></thead><tbody>${R.severity.underS1S2.map(u=>`<tr><td>${esc(u.text)}</td><td>${pill(u.truth)}</td><td>${pill(u.got)}</td></tr>`).join('')}</tbody></table></div>
  <p class="small">Polite, low-key messages are the weak spot. The same person wrote the test messages and the system, so real results will probably be lower.</p></section>
  <details class="extra"><summary>Money view by approach</summary><div class="tw" style="margin-top:10px"><table><thead><tr><th>Approach</th><th>Serious issues raised</th><th>USD gained or lost per issue</th></tr></thead><tbody>${tr.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.criticalRecall}%</td><td>${x.netPayoffPerIssue['0.05']}</td></tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:8px">Uses assumed costs from the proposal, and assumes 5% of issues are serious.</p></details></div>`;
}
function render(){nav();document.getElementById('view').innerHTML=S.sel?detail():S.tab==='rules'?rules():S.tab==='results'?results():home();}
function refresh(){recompute();render()}
function routeNow(t,owner,sev,why){
  const changed=owner!==t.triage.owner||sev!==t.sev,secs=t.st.opened?Math.round((Date.now()-t.st.opened)/1000):0;
  Object.assign(t.st,{routed:true,owner,override:changed?why:null});
  if(sev!==t.sev){t.humanSev=sev;t.sev=sev}
  log(`${t.id} sent to ${owner}, ${sev}${changed?' (changed: '+why+')':''}, checked in ${secs}s`);
}
function sendNow(t,text){Object.assign(t.st,{reply:text,sent:true,everSent:true,lane:'client',since:new Date().toTimeString().slice(0,5),waiting:'Reply sent. Waiting for the client to confirm.'});log(`${t.id} reply ${t.st.edited?'edited and ':''}sent (simulated)`)}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const t=cur();
  if(b.dataset.tab){S.tab=b.dataset.tab;S.sel=null;render();scrollTo(0,0);return}
  if(b.dataset.home){S.sel=null;render();return}
  if(b.dataset.t){S.sel=b.dataset.t;render();scrollTo(0,0);return}
  if(b.id==='merge'){t.peers.forEach(id=>{S.tickets.find(x=>x.id===id).st.merge=true});log(`${t.peers.join(', ')} combined by engineer (${t.id})`);render();return}
  if(b.id==='route'){
    const owner=document.getElementById('owner').value,sev=document.getElementById('sev').value,why=document.getElementById('why').value.trim(),err=document.getElementById('err');
    const changed=owner!==t.triage.owner||sev!==t.sev;
    if(!owner){err.hidden=false;err.textContent='Choose a team first.';return}
    if(changed&&!why&&t.triage.level!=='L0'){err.hidden=false;err.textContent='Please say briefly why you changed it.';return}
    routeNow(t,owner,sev,why);render();return}
  if(b.id==='fix'){t.st.fix=true;log(`${t.id} fix assigned to the ${FIX_TEAM.toLowerCase()}`);render();return}
  if(b.id==='resetreply'){t.st.edited=false;t.st.reply=null;render();return}
  if(b.id==='send'){const text=document.getElementById('reply').value;if(replyHint(text))return;sendNow(t,text);render();return}
  if(b.id==='replied'){Object.assign(t.st,{lane:'team',sent:false,next:'',reply:null,edited:false,waiting:''});log(`${t.id} client answered; back with the team`);render();return}
  if(b.id==='close'){t.st.lane='closed';t.st.closed=true;log(`${t.id} closed by engineer`);render();return}
  if(b.id==='add'){const v=document.getElementById('newt').value.trim();if(!v)return;const last=S.tickets.reduce((a,x)=>Math.max(a,x.minute),0)+1,id='T-'+S.n++;
    S.tickets.push({id,text:v,client:'Your test message',channel:'Console',time:'now',minute:last,st:blank()});S.sel=id;refresh();return}
});
document.addEventListener('change',e=>{
  const el=e.target,t=cur();
  if(el.id==='mh'){refresh();return}
  if(el.dataset.level){cfg.categories[el.dataset.level].level=el.value;log(`For ${cfg.categories[el.dataset.level].label}, TradeSentinel now ${LEVEL[el.value].toLowerCase()}`);refresh();return}
  if(el.dataset.cause!==undefined){t.st.cause=+el.dataset.cause;t.st.fix=false;log(`${t.id} cause confirmed by engineer`);render();return}
  if(el.id==='next'){t.st.next=el.value;if(t.st.edited&&t.st.reply)t.st.reply=t.st.reply.replace(/\[NEXT UPDATE TIME:[^\]]*\]/,'Next update by '+el.value+'.');render();return}
});
document.addEventListener('input',e=>{
  const el=e.target,t=cur();
  if(el.id==='thr'){cfg.confidence_threshold=+el.value;document.getElementById('thrv').textContent=pc(cfg.confidence_threshold);recompute();return}
  if(el.id==='reply'){t.st.reply=el.value;t.st.edited=true;const h=replyHint(el.value),hint=document.getElementById('replyhint');document.getElementById('send').disabled=!!h;hint.textContent=h||'Sending moves this issue to "With the client". You are responsible for what you send.';hint.classList.toggle('block',!!h)}
});
// Named views: #issues, #rules, #results, a ticket such as #T-1005, or #walk-T-1001 to replay a finished case for screenshots.
function fromHash(){
  const h=location.hash.slice(1),alias={control:'rules',evidence:'results',queue:'issues'};
  if(['issues','rules','results'].includes(alias[h]||h)){S.tab=alias[h]||h;S.sel=null}
  else if(/^T-\d+$/.test(h)&&S.tickets.some(x=>x.id===h))S.sel=h;
  else if(h.startsWith('walk-')){const id=h.slice(5),t=S.tickets.find(x=>x.id===id);if(t){S.sel=id;routeNow(t,t.triage.owner,t.sev,'');t.st.cause=0;t.st.fix=true;t.st.next='10:30';log(`${id} cause confirmed, fix assigned (replayed)`)}}
}
recompute();fromHash();render();addEventListener('hashchange',()=>{fromHash();render()});
</script>
