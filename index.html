<style>
/* Layout: a white top bar, three summary cards, then two lanes split by who must act next. One issue opens as plain steps beside a short summary card. */
:root{--bg:#f4f6fa;--card:#fff;--bar:#fff;--ink:#16213a;--muted:#56627d;--faint:#8590a8;--line:#e2e6ef;--navy:#1f3864;--navy-ink:#fff;--accent:#8b1e3f;--soft:#eef1f8;
--team:#1f3864;--team-soft:#e8edf7;--client:#8a5a00;--client-soft:#fbf2df;--done:#16704a;--done-soft:#e4f3eb;
--s1:#b3123a;--s1b:#fde8ed;--s2:#b4500c;--s2b:#fdeee3;--s3:#7a6300;--s3b:#faf4d9;--s4:#46617f;--s4b:#e9eff6;
--shadow:0 1px 2px rgba(22,33,58,.06),0 4px 14px rgba(22,33,58,.05);
--sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--serif:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1527;--card:#172038;--bar:#131b30;--ink:#e7ecf6;--muted:#a3aec6;--faint:#7d88a4;--line:#28334e;--navy:#93b2ec;--navy-ink:#0f1527;--accent:#f08cab;--soft:#202b47;--team:#93b2ec;--team-soft:#1e2a48;--client:#f0c56a;--client-soft:#2d2714;--done:#5cd19c;--done-soft:#163226;--s1:#ff7896;--s1b:#3a1822;--s2:#ffa565;--s2b:#3a2416;--s3:#e8cc5a;--s3b:#332c12;--s4:#a5bfdc;--s4b:#1f2b40;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1527;--card:#172038;--bar:#131b30;--ink:#e7ecf6;--muted:#a3aec6;--faint:#7d88a4;--line:#28334e;--navy:#93b2ec;--navy-ink:#0f1527;--accent:#f08cab;--soft:#202b47;--team:#93b2ec;--team-soft:#1e2a48;--client:#f0c56a;--client-soft:#2d2714;--done:#5cd19c;--done-soft:#163226;--s1:#ff7896;--s1b:#3a1822;--s2:#ffa565;--s2b:#3a2416;--s3:#e8cc5a;--s3b:#332c12;--s4:#a5bfdc;--s4b:#1f2b40;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);margin:0;padding-block:0 56px}
.bar{background:var(--bar);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.inner{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.bar .inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font:600 20px var(--serif);color:var(--ink)}
.mark{width:30px;height:30px;border-radius:8px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font:600 13px var(--sans);letter-spacing:.03em}

h3{font:600 16px var(--sans);margin:0}
p{margin:0}

@media(max-width:600px){.counts{grid-template-columns:minmax(0,1fr)}}

.count.team b{color:var(--team)}.count.client b{color:var(--client)}.count.done b{color:var(--done)}

.lane{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px;min-width:0}

.issue .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.issue .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.issue .who{font-weight:600}

details{margin-top:2px}
summary{cursor:pointer;color:var(--navy);font-weight:500;font-size:14px}
.extra{margin-top:24px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}

textarea{width:100%;min-height:80px;resize:vertical}
button.primary,button.ghost{font:500 14px var(--sans);border-radius:10px;padding:9px 18px;cursor:pointer}

button.ghost{background:var(--card);color:var(--navy);border:1px solid var(--line)}
button.link{background:none;border:0;color:var(--navy);font:500 13px var(--sans);cursor:pointer;padding:0;text-decoration:underline}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.issue:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{background:none;border:0;color:var(--navy);font:500 14px var(--sans);cursor:pointer;padding:0;margin:20px 0 16px}

.step{display:flex;align-items:center;gap:10px}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--sans);background:var(--team-soft);color:var(--navy);flex:none}
.step .n.done{background:var(--done-soft);color:var(--done)}
.read{font-size:16px;line-height:1.6}
.sme-box{background:var(--s1b);color:var(--s1);border-radius:12px;padding:12px 14px;font-size:14px}
.okmsg{color:var(--done);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

.cause.sel{border-color:var(--done);background:var(--done-soft)}
.cause input{margin-top:4px}
.ev{font-size:13px;color:var(--muted)}
.fixbox{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.waitbox{background:var(--client-soft);color:var(--client);border-radius:12px;padding:12px 14px;font-size:14px}
.hint{font-size:13px;color:var(--faint)}
.hint.block{color:var(--client)}
.draft{background:var(--soft);border-radius:12px;padding:14px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.log{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px}
td{border-bottom:1px solid var(--line);padding:10px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:18px}
.tile{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
.tile b{display:block;font:600 28px var(--serif);color:var(--navy)}
.tile span{font-size:13px;color:var(--muted)}
.narrow{max-width:900px}

<div class="bar"><div class="inner">
  <div class="brand"><span class="mark">TS</span>TradeSentinel</div>
  <nav role="tablist" id="nav"></nav>
  <div class="grow"></div>
  <label class="switch"><input type="checkbox" id="mh" checked> Market open</label>

<p class="note">Demo with made-up data. It is not connected to any real system.</p>
<main id="view"></main>

<script>// TradeSentinel decision engine. Runs unchanged in the browser demo and in the evaluation harness.
// The classifiers stand in for the pilot's API language model; the control layer is the real design.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.TradeSentinelEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const STOP = new Set('a an the and or but if to of in on at for from by with is are was were be been it this that i my me we our you your they them he she have has had do does did not no as so just please can could would will there here am pm what why how when where who which than then too very some any all'.split(' ').filter(w => !['not', 'no', 'all', 'how', 'where', 'what', 'why', 'any'].includes(w)));
  const RANK = { S4: 0, S3: 1, S2: 2, S1: 3 };
  const SEV = ['S4', 'S3', 'S2', 'S1'];
  const higher = (a, b) => (RANK[a] >= RANK[b] ? a : b);

  function stem(w) {
    if (w.length > 5 && w.endsWith('ing')) return w.slice(0, -3);
    if (w.length > 4 && w.endsWith('ed')) return w.slice(0, -2);
    if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
    return w;
  }
  function tokens(text) {
    const words = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w)).map(stem);
    const out = words.slice();
    for (let i = 0; i < words.length - 1; i++) out.push(words[i] + '_' + words[i + 1]);
    return out;
  }

  // Multinomial naive Bayes with temperature scaling, so that confidence can be calibrated.
  function trainNB(docs, labelKey, alpha = 0.3) {
    const labels = [...new Set(docs.map(d => d[labelKey]))];
    const counts = {}, totals = {}, prior = {}, vocab = new Set();
    labels.forEach(l => { counts[l] = {}; totals[l] = 0; prior[l] = 0; });
    docs.forEach(d => {
      const l = d[labelKey]; prior[l]++;
      tokens(d.text).forEach(t => { counts[l][t] = (counts[l][t] || 0) + 1; totals[l]++; vocab.add(t); });
    });
    return { labels, counts, totals, prior, V: vocab.size, N: docs.length, alpha, vocab };
  }
  function predictNB(m, text, T = 1) {
    const toks = tokens(text).filter(t => m.vocab.has(t));
    const logs = m.labels.map(l => {
      let s = Math.log(m.prior[l] / m.N);
      toks.forEach(t => { s += Math.log(((m.counts[l][t] || 0) + m.alpha) / (m.totals[l] + m.alpha * m.V)); });
      return s;
    });
    const scale = Math.max(1, toks.length) * T; // length normalised so long tickets are not overconfident
    const max = Math.max(...logs);
    const raw = logs.map(s => Math.exp((s - max) / scale));
    const sum = raw.reduce((a, b) => a + b, 0);
    return m.labels.map((l, i) => ({ label: l, p: raw[i] / sum })).sort((a, b) => b.p - a.p);
  }

  function tfidf(docsTokens) {
    const df = {};
    docsTokens.forEach(ts => new Set(ts).forEach(t => { df[t] = (df[t] || 0) + 1; }));
    const N = docsTokens.length;
    const idf = t => Math.log((N + 1) / ((df[t] || 0) + 1)) + 1;
    const vec = ts => {
      const v = {}; ts.forEach(t => { v[t] = (v[t] || 0) + 1; });
      let n = 0; Object.keys(v).forEach(t => { v[t] = v[t] * idf(t); n += v[t] * v[t]; });
      n = Math.sqrt(n) || 1; Object.keys(v).forEach(t => { v[t] /= n; });
      return v;
    };
    return { vec };
  }
  const cosine = (a, b) => { let s = 0; for (const t in a) if (b[t]) s += a[t] * b[t]; return s; };

  function create({ config, train, incidents, deployments, runbooks, temperature = 1 }) {
    const catModel = trainNB(train, 'cat');
    const sevModel = trainNB(train, 'sev');
    const incTokens = incidents.map(i => tokens(i.title + ' ' + i.symptoms));
    const idx = tfidf(incTokens.concat(train.map(d => tokens(d.text))));
    const incVecs = incTokens.map(idx.vec);

    function severityOf(text, cat, marketHours) {
      const c = config.categories[cat];
      return marketHours ? c.floor_market : c.floor_off;
    }
    function isSecurity(text) {
      const low = text.toLowerCase();
      return config.security_rule.terms.filter(t => low.includes(t));
    }

    function triage(ticket) {
      const probs = predictNB(catModel, ticket.text, temperature);
      const top = probs[0];
      const lowConf = top.p < config.confidence_threshold;
      const sevProbs = predictNB(sevModel, ticket.text, temperature);
      const modelSeverity = sevProbs[0].label;
      const trail = [{ step: 'Model proposal', sev: modelSeverity, why: `Language signals in the report (${Math.round(sevProbs[0].p * 100)}% confidence)` }];
      let sev = modelSeverity;
      const floor = severityOf(ticket.text, top.label, ticket.marketHours);
      if (RANK[floor] > RANK[sev]) trail.push({ step: 'Category floor', sev: floor, why: `${config.categories[top.label].label} ${ticket.marketHours ? 'in market hours' : 'off hours'} is never below ${floor}` });
      sev = higher(sev, floor);
      if (lowConf) { // when unsure, take the strictest floor of any plausible category
        probs.filter(a => a.p >= config.uncertain_alternative_probability).forEach(a => {
          const f = severityOf(ticket.text, a.label, ticket.marketHours);
          if (RANK[f] > RANK[sev]) { trail.push({ step: 'Uncertainty floor', sev: f, why: `Could be ${config.categories[a.label].label} (${Math.round(a.p * 100)}%), so its floor applies` }); sev = f; }
        });
      }
      const sec = isSecurity(ticket.text);
      if (sec.length && RANK[config.security_rule.floor] > RANK[sev]) { trail.push({ step: 'Security rule', sev: config.security_rule.floor, why: `Report mentions "${sec[0]}"` }); sev = config.security_rule.floor; }
      const cat = config.categories[top.label];
      const reasons = [];
      if (sec.length) reasons.push('possible security event');
      if (lowConf) reasons.push(`low confidence (${Math.round(top.p * 100)}%)`);
      if (cat.always_senior) reasons.push('possible execution failure');
      return {
        category: top.label, confidence: top.p, alternatives: probs.slice(1, 3), lowConfidence: lowConf,
        modelSeverity, floorSeverity: floor, severity: sev, trail, security: sec.length > 0,
        owner: sec.length ? config.security_rule.route : cat.owner,
        senior: reasons.length > 0 || sev === 'S1', seniorReasons: reasons, level: cat.level,
      };
    }

    // Suggests incidents only. A human confirms any merge in the interface.
    function cluster(tickets) {
      const vecs = tickets.map(t => idx.vec(tokens(t.text)));
      const groups = [];
      tickets.forEach((t, i) => {
        const tri = t.triage || triage(t);
        let best = null, bestSim = 0;
        groups.forEach(g => {
          if (g.category !== tri.category) return;
          const last = tickets[g.members[g.members.length - 1]];
          if (t.minute - last.minute > config.cluster.window_minutes || t.minute < last.minute) return;
          const sim = Math.max(...g.members.map(m => cosine(vecs[i], vecs[m])));
          if (sim >= bestSim) { bestSim = sim; best = g; }
        });
        // Same category inside the window: text similarity, or two sev-2+ reports in a burst.
        const burst = best && RANK[tri.severity] >= RANK.S2 && t.minute - tickets[best.members[best.members.length - 1]].minute <= 6;
        if (best && (bestSim >= config.cluster.similarity_threshold || burst)) best.members.push(i);
        else groups.push({ category: tri.category, members: [i] });
      });
      return groups;
    }

    // Blast radius can only raise severity.
    function applyBlastRadius(sev, reports, marketHours) {
      let out = sev; const steps = [];
      config.blast_radius.forEach(r => {
        if (reports >= r.min_reports && (!r.market_hours_only || marketHours) && RANK[r.floor] > RANK[out]) {
          out = r.floor; steps.push({ step: 'Blast radius', sev: r.floor, why: `${reports} clients reporting the same fault` });
        }
      });
      return { severity: out, steps };
    }

    function hypotheses(text, category, minute) {
      const v = idx.vec(tokens(text));
      const scored = incidents.map((inc, i) => ({ inc, sim: cosine(v, incVecs[i]) + (inc.cat === category ? 0.1 : 0) })).sort((a, b) => b.sim - a.sim).slice(0, 6);
      const byCause = {};
      scored.forEach(({ inc, sim }) => {
        if (sim <= 0) return;
        const h = byCause[inc.cause] || (byCause[inc.cause] = { cause: inc.cause, score: 0, summary: inc.causeText, fix: inc.fix, evidence: [] });
        h.score += sim;
        h.evidence.push({ type: 'Past incident', id: inc.id, text: inc.title });
      });
      deployments.forEach(d => { // a release shortly before the report is evidence, not proof
        if (minute !== undefined && minute >= d.minute && minute - d.minute <= 240 && byCause[d.cause]) {
          byCause[d.cause].score *= 1.5;
          byCause[d.cause].evidence.push({ type: 'Deployment', id: d.id, text: d.text });
        }
      });
      const list = Object.values(byCause).sort((a, b) => b.score - a.score).slice(0, 3);
      const total = list.reduce((a, h) => a + h.score, 0) || 1;
      list.forEach(h => { h.weight = h.score / total; });
      return list;
    }

    // Statements are only allowed with a citation. A missing cause stays a visible placeholder.
    function draftUpdate({ reports, severity, category, confirmed, startedAt, approved }) {
      const label = config.categories[category].label.toLowerCase();
      const names = { S1: 'critical', S2: 'high', S3: 'medium', S4: 'low' };
      const cause = confirmed ? `We have found the cause: ${confirmed.summary.replace(/\.$/, '')} (reference ${confirmed.evidence[0].id}).` : '[CAUSE NOT CONFIRMED: pick a cause in step 2]';
      const impact = reports > 1 ? `${reports} clients have reported the same problem, and we are handling it as one incident.` : '';
      const text = `Thank you for letting us know. We are working on the problem you reported at ${startedAt} (${label}), and we have given it ${names[severity] || severity} priority. ${impact} ${cause} [NEXT UPDATE TIME: set it below]`.replace(/\s+/g, ' ');
      const placeholders = (text.match(/\[[A-Z ]+[:][^\]]*\]/g) || []);
      return { text, placeholders, canSend: !!approved && placeholders.length === 0 };
    }
    function closureNote({ category, confirmed, fix, severity, reports }) {
      if (!confirmed) return '[Closure note blocked: no confirmed cause selected]';

  }

  const KEYWORDS = {

  };

    const low = text.toLowerCase();
    let best = 'access_howto', n = 0;
    Object.entries(KEYWORDS).forEach(([c, ks]) => { const hit = ks.filter(k => low.includes(k)).length; if (hit > n) { n = hit; best = c; } });

  if(b.id==='replied'){Object.assign(t.st,{lane:'team',sent:false,next:'',reply:null,edited:false,waiting:''});log(`${t.id} client answered; back with the team`);render();return}
  if(b.id==='close'){t.st.lane='closed';t.st.closed=true;log(`${t.id} closed by engineer`);render();return}
  if(b.id==='add'){const v=document.getElementById('newt').value.trim();if(!v)return;const last=S.tickets.reduce((a,x)=>Math.max(a,x.minute),0)+1,id='T-'+S.n++;
    S.tickets.push({id,text:v,client:'Your test message',channel:'Console',time:'now',minute:last,st:blank()});S.sel=id;refresh();return}
});
document.addEventListener('change',e=>{
  const el=e.target,t=cur();
  if(el.id==='mh'){refresh();return}
  if(el.dataset.level){cfg.categories[el.dataset.level].level=el.value;log(`For ${cfg.categories[el.dataset.level].label}, TradeSentinel now ${LEVEL[el.value].toLowerCase()}`);refresh();return}
  if(el.dataset.cause!==undefined){t.st.cause=+el.dataset.cause;t.st.fix=false;log(`${t.id} cause confirmed by engineer`);render();return}
  if(el.id==='next'){t.st.next=el.value;if(t.st.edited&&t.st.reply)t.st.reply=t.st.reply.replace(/\[NEXT UPDATE TIME:[^\]]*\]/,'Next update by '+el.value+'.');render();return}
});
document.addEventListener('input',e=>{
  const el=e.target,t=cur();
  if(el.id==='thr'){cfg.confidence_threshold=+el.value;document.getElementById('thrv').textContent=pc(cfg.confidence_threshold);recompute();return}
  if(el.id==='reply'){t.st.reply=el.value;t.st.edited=true;const h=replyHint(el.value),hint=document.getElementById('replyhint');document.getElementById('send').disabled=!!h;hint.textContent=h||'Sending moves this issue to "With the client". You are responsible for what you send.';hint.classList.toggle('block',!!h)}
});
// Named views: #issues, #rules, #results, a ticket such as #T-1005, or #walk-T-1001 to replay a finished case for screenshots.
function fromHash(){
  const h=location.hash.slice(1),alias={control:'rules',evidence:'results',queue:'issues'};
  if(['issues','rules','results'].includes(alias[h]||h)){S.tab=alias[h]||h;S.sel=null}
  else if(/^T-\d+$/.test(h)&&S.tickets.some(x=>x.id===h))S.sel=h;
  else if(h.startsWith('walk-')){const id=h.slice(5),t=S.tickets.find(x=>x.id===id);if(t){S.sel=id;routeNow(t,t.triage.owner,t.sev,'');t.st.cause=0;t.st.fix=true;t.st.next='10:30';log(`${id} cause confirmed, fix assigned (replayed)`)}}
}
recompute();fromHash();render();addEventListener('hashchange',()=>{fromHash();render()});
</script>
