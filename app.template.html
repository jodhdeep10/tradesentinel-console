<title>TradeSentinel Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: a calm home board with two lanes (with your team, with the client); one issue opens on its own page as three plain steps. Detail sits behind "Show why" toggles. */
:root{--bg:#f6f7fb;--card:#fff;--ink:#17223b;--muted:#5d6883;--faint:#8b94aa;--line:#e3e7f0;--navy:#1f3864;--navy-ink:#fff;--accent:#8b1e3f;--soft:#eef1f8;--team:#1f3864;--client:#8a5a00;--client-soft:#fbf3e2;
--s1:#b3123a;--s1b:#fde8ed;--s2:#b4500c;--s2b:#fdeee3;--s3:#7a6300;--s3b:#faf4d9;--s4:#46617f;--s4b:#e9eff6;--ok:#16704a;--okb:#e5f4ec;
--sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--serif:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--card:#182139;--ink:#e7ecf6;--muted:#a3aec6;--faint:#7c87a3;--line:#29344f;--navy:#93b2ec;--navy-ink:#10162a;--accent:#f08cab;--soft:#212c48;--team:#93b2ec;--client:#f0c56a;--client-soft:#2e2814;--s1:#ff7896;--s1b:#3a1822;--s2:#ffa565;--s2b:#3a2416;--s3:#e8cc5a;--s3b:#332c12;--s4:#a5bfdc;--s4b:#1f2b40;--ok:#5cd19c;--okb:#173326;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10162a;--card:#182139;--ink:#e7ecf6;--muted:#a3aec6;--faint:#7c87a3;--line:#29344f;--navy:#93b2ec;--navy-ink:#10162a;--accent:#f08cab;--soft:#212c48;--team:#93b2ec;--client:#f0c56a;--client-soft:#2e2814;--s1:#ff7896;--s1b:#3a1822;--s2:#ffa565;--s2b:#3a2416;--s3:#e8cc5a;--s3b:#332c12;--s4:#a5bfdc;--s4b:#1f2b40;--ok:#5cd19c;--okb:#173326;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);margin:0;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding:22px 0 18px}
.brand{font:600 22px var(--serif);color:var(--navy);letter-spacing:.01em}
nav{display:flex;gap:4px}
nav button{background:none;border:0;border-radius:20px;padding:6px 14px;font:500 14px var(--sans);color:var(--muted);cursor:pointer}
nav button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.08)}
.grow{flex:1}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--faint);margin:0 0 22px}
h1{font:600 26px/1.25 var(--serif);margin:0 0 6px;text-wrap:balance}
h2{font:600 18px var(--serif);margin:0;text-wrap:balance}
h3{font:600 15px var(--sans);margin:0 0 10px}
p{margin:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.counts{display:flex;flex-wrap:wrap;gap:12px 40px;margin:4px 0 26px}
.count b{display:block;font:600 34px/1 var(--serif);font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--muted)}
.count.team b{color:var(--team)}.count.client b{color:var(--client)}.count.done b{color:var(--ok)}
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
@media(max-width:820px){.lanes{grid-template-columns:minmax(0,1fr)}}
.lane{min-width:0}
.lane-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.lane-head .dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center}
.lane.team .dot{background:var(--team)}.lane.client .dot{background:var(--client)}
.lane-sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:10px}
.issue{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;color:inherit;font:inherit}
.issue:hover{border-color:var(--navy)}
.issue .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.issue .who{font-weight:600}
.issue .when{margin-left:auto;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.issue .text{color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wait{font-size:13px;color:var(--client);background:var(--client-soft);border-radius:8px;padding:6px 10px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--faint);text-align:center;font-size:14px}
.pill{display:inline-block;font:600 12px var(--sans);padding:2px 9px;border-radius:20px;white-space:nowrap}
.S1{color:var(--s1);background:var(--s1b)}.S2{color:var(--s2);background:var(--s2b)}.S3{color:var(--s3);background:var(--s3b)}.S4{color:var(--s4);background:var(--s4b)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 8px;white-space:nowrap}
.tag.warn{color:var(--accent);border-color:var(--accent)}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;color:var(--navy);font-weight:500;font-size:14px}
.add{margin-top:30px}
textarea,select,input[type=text],input[type=time]{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:72px;margin:10px 0}
button.primary,button.ghost{font:500 14px var(--sans);border-radius:8px;padding:8px 16px;cursor:pointer}
button.primary{background:var(--navy);color:var(--navy-ink);border:1px solid var(--navy)}
button.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.issue:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{background:none;border:0;color:var(--navy);font:500 14px var(--sans);cursor:pointer;padding:0;margin-bottom:18px}
.page{max-width:760px}
.quote{font:400 19px/1.5 var(--serif);margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.step{display:flex;align-items:center;gap:10px}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--sans);background:var(--soft);color:var(--navy);flex:none}
.step .n.done{background:var(--okb);color:var(--ok)}
.read{font-size:16px}
.alert{background:var(--s1b);color:var(--s1);border-radius:10px;padding:10px 14px;font-size:14px}
.okmsg{color:var(--ok);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.trail{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.cause{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.cause.sel{border-color:var(--ok);background:var(--okb)}
.cause input{margin-top:4px}
.ev{font-size:13px;color:var(--muted)}
.draft{background:var(--soft);border-radius:10px;padding:14px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
mark{background:var(--client-soft);color:var(--client);padding:1px 4px;border-radius:4px}
.fine{font-size:12.5px;color:var(--faint)}
.log{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px}
td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile b{display:block;font:600 28px var(--serif);color:var(--navy)}
.tile span{font-size:13px;color:var(--muted)}
pre{font-size:12px;overflow:auto;background:var(--soft);padding:12px;border-radius:8px;margin:10px 0 0}
</style>
<div class="wrap">
<header>
  <div class="brand">TradeSentinel</div>
  <nav role="tablist" id="nav"></nav>
  <div class="grow"></div>
  <label class="switch"><input type="checkbox" id="mh" checked> Market open</label>
</header>
<p class="note">Prototype with invented data. Nothing connects to a live system; a local model stands in for the pilot's language model.</p>
<main id="view"></main>
</div>
<script>__ENGINE__</script>
<script>
const RAW=__DATA__, E=TradeSentinelEngine, D=E.parseData(RAW), HOLD=__EVAL__;
const cfg=__CONFIG__, runbooks=__RUNBOOKS__, PAPER=__PAPER__;
const eng=E.create({config:cfg,train:D.train,incidents:D.incidents,deployments:D.deployments,runbooks,temperature:HOLD.temperature});
const LEVEL={L0:'Shadow',L1:'Suggest',L2:'Assisted',L3:'Limited auto'};
const LEVEL_HELP={L0:'Suggestions are hidden and only recorded.',L1:'TradeSentinel suggests; you choose.',L2:'Routing is filled in; you approve it.'};
const SEVNAME={S1:'Critical',S2:'High',S3:'Medium',S4:'Low'};
// Issues already waiting on the client when the demo opens.
const WITH_CLIENT={'T-1007':{owner:'Client Service Desk',cause:0,waiting:'Guide sent. Waiting for the client to confirm it answers the question.',since:'10:40'},
  'T-1008':{owner:'Post-Trade Engineering',cause:null,waiting:'Asked the client for the order ID and contract note.',since:'10:52'},
  'T-1011':{owner:'Connectivity Support',cause:0,waiting:'Sequence reset done. Waiting for the client to reconnect and confirm.',since:'11:55'}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=x=>Math.round(x*100)+'%';
const pill=s=>`<span class="pill ${s}">${s} ${SEVNAME[s]}</span>`;
const blank=()=>({opened:null,lane:'team',routed:false,owner:null,override:null,merge:false,cause:null,fix:false,next:'',sent:false,everSent:false,closed:false,waiting:'',since:''});
const S={tab:'issues',sel:null,audit:[],n:1013,tickets:D.demo.map(t=>{const st=blank(),w=WITH_CLIENT[t.id];if(w)Object.assign(st,{lane:'client',routed:true,owner:w.owner,cause:w.cause,sent:true,everSent:true,waiting:w.waiting,since:w.since});return {...t,st}})};
function log(m){S.audit.unshift(new Date().toTimeString().slice(0,5)+'  '+m)}
function recompute(){
  const mh=document.getElementById('mh').checked;
  S.tickets.forEach(t=>{t.marketHours=mh;t.triage=eng.triage(t)});
  eng.cluster(S.tickets).forEach(g=>g.members.forEach(m=>{const t=S.tickets[m],b=eng.applyBlastRadius(t.triage.severity,g.members.length,t.marketHours);
    t.reports=g.members.length;t.peers=g.members.map(x=>S.tickets[x].id);t.fullTrail=t.triage.trail.concat(b.steps);t.sev=t.humanSev||b.severity}));
}
const cur=()=>S.tickets.find(t=>t.id===S.sel);
function nav(){document.getElementById('nav').innerHTML=[['issues','Issues'],['rules','Rules'],['results','Results']].map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k&&!S.sel}" data-tab="${k}">${l}</button>`).join('')}
function card(t){
  const r=t.triage,tags=[];
  if(t.reports>1)tags.push(`<span class="tag">${t.reports} reports</span>`);
  if(t.st.lane==='team'&&(r.senior||t.sev==='S1'))tags.push('<span class="tag warn">Senior review</span>');
  return `<button class="issue" data-t="${t.id}"><span class="top">${pill(t.sev)}<span class="who">${esc(t.client)}</span>${tags.join('')}<span class="when">${t.st.lane==='client'?'since '+esc(t.st.since):esc(t.time)}</span></span>
  <span class="text">${esc(t.text)}</span>${t.st.lane==='client'?`<span class="wait">${esc(t.st.waiting)}</span>`:''}</button>`;
}
function home(){
  const by=l=>S.tickets.filter(t=>t.st.lane===l).sort((a,b)=>E.RANK[b.sev]-E.RANK[a.sev]||a.minute-b.minute);
  const team=by('team'),client=by('client'),done=by('closed');
  return `<div class="counts"><div class="count team"><b>${team.length}</b><span>With your team</span></div><div class="count client"><b>${client.length}</b><span>With the client</span></div><div class="count done"><b>${done.length}</b><span>Closed today</span></div></div>
  <div class="lanes">
   <section class="lane team"><div class="lane-head"><span class="dot"></span><h2>With your team</h2></div><p class="lane-sub">Needs action from support, most urgent first.</p><div class="list">${team.map(card).join('')||'<div class="empty">Nothing waiting on your team.</div>'}</div></section>
   <section class="lane client"><div class="lane-head"><span class="dot"></span><h2>With the client</h2></div><p class="lane-sub">An update has gone out. Waiting for the client to reply or confirm.</p><div class="list">${client.map(card).join('')||'<div class="empty">Nothing waiting on clients.</div>'}</div></section>
  </div>
  ${done.length?`<details class="add"><summary>Closed today (${done.length})</summary><div class="list" style="margin-top:12px">${done.map(card).join('')}</div></details>`:''}
  <details class="add"><summary>Try your own report</summary><label class="small muted" for="newt" style="display:block;margin-top:10px">Type a client message and TradeSentinel will triage it.</label><textarea id="newt" placeholder="e.g. my sell order went through but nothing shows at the exchange"></textarea><button class="ghost" id="add">Triage this report</button></details>`;
}
function why(t){
  const r=t.triage,c=cfg.categories[r.category];
  const last=t.fullTrail[t.fullTrail.length-1];
  const lead=last.step==='Blast radius'?`${t.reports} clients are reporting the same fault`:last.step==='Model proposal'?'of how the report is worded':last.step==='Uncertainty floor'?last.why.replace(/, so its floor applies$/,'').replace(/^Could/,'it could'):last.why.replace(/^./,m=>m.toLowerCase());
  return `<p class="read">This looks like <b>${esc(c.label.toLowerCase())}</b> (${pc(r.confidence)} sure). Priority is <b>${t.sev} ${SEVNAME[t.sev]}</b> because ${esc(lead)}.</p>
  ${r.lowConfidence?'<p class="small muted">TradeSentinel is unsure, so the strictest plausible priority applies.</p>':''}
  <details><summary>Show why</summary><ol class="trail">${t.fullTrail.map(s=>`<li>${pill(s.sev)} <b>${s.step}:</b> ${esc(s.why)}</li>`).join('')}</ol>
  <p class="small muted" style="margin-top:10px">Other possibilities: ${r.alternatives.map(a=>esc(cfg.categories[a.label].label)+' '+pc(a.p)).join(', ')}. Priority can be raised by the system but only lowered by a person.</p></details>`;
}
function stepAssign(t){
  const r=t.triage,c=cfg.categories[r.category],lvl=c.level,st=t.st,pre=lvl==='L2';
  const owners=[...new Set(Object.values(cfg.categories).map(x=>x.owner).concat([cfg.security_rule.route]))];
  const head=`<div class="step"><span class="n ${st.routed?'done':''}">1</span><h3 style="margin:0">Assign</h3><span class="grow"></span><span class="tag" title="${esc(LEVEL_HELP[lvl]||'')}">${LEVEL[lvl]} (${lvl})</span></div>`;
  if(st.routed)return `<section class="card">${head}<p class="okmsg">Assigned to ${esc(st.owner)}${st.override?` <span class="muted">(changed: ${esc(st.override)})</span>`:''}</p></section>`;
  return `<section class="card">${head}
  ${lvl==='L0'?'<p class="muted">Shadow mode: suggestions are hidden, so choose without them.</p>':`<p class="muted small">${esc(LEVEL_HELP[lvl])}${c.held_reason?' '+esc(c.held_reason):''}</p>`}
  <div class="row"><label class="field">Team<select id="owner">${pre?'':'<option value="">Choose a team</option>'}${owners.map(o=>`<option ${pre&&o===r.owner?'selected':''}>${esc(o)}</option>`).join('')}</select></label>
  <label class="field">Priority<select id="sev">${['S1','S2','S3','S4'].map(s=>`<option value="${s}" ${s===t.sev?'selected':''}>${s} ${SEVNAME[s]}</option>`).join('')}</select></label></div>
  ${lvl!=='L0'&&!pre?`<p class="small muted">Suggested team: ${esc(r.owner)}</p>`:''}
  <label class="field">Reason, if you change anything<input type="text" id="why"></label>
  <p id="err" class="small" style="color:var(--s1)" hidden></p>
  <div><button class="primary" id="route">${pre?'Approve':'Assign'}</button></div></section>`;
}
function stepCause(t){
  const st=t.st,head=`<div class="step"><span class="n ${st.cause!==null?'done':''}">2</span><h3 style="margin:0">Find the cause</h3></div>`;
  if(!st.routed)return `<section class="card">${head}<p class="faint">Opens once the issue is assigned.</p></section>`;
  const hs=eng.hypotheses(t.text,t.triage.category,t.minute),conf=st.cause!==null?hs[st.cause]:null;
  return `<section class="card">${head}<p class="small muted">Likely causes from past incidents and recent releases. Pick the one the evidence supports.</p>
  ${hs.map((h,i)=>`<label class="cause ${st.cause===i?'sel':''}"><input type="radio" name="cause" data-cause="${i}" ${st.cause===i?'checked':''}><span><b>${esc(h.summary)}</b><br><span class="ev">Evidence: ${h.evidence.map(e=>esc(e.id)).join(', ')}</span></span></label>`).join('')}
  ${conf?`<p>Suggested fix: ${esc(conf.fix)}</p><div>${st.fix?'<span class="okmsg">Fix approved. The engineer runs it through the change process.</span>':'<button class="ghost" id="fix">Approve fix</button>'}</div>`:''}
  <details><summary>Runbook</summary><ol class="trail">${runbooks[t.triage.category].map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details></section>`;
}
function stepUpdate(t){
  const st=t.st,head=`<div class="step"><span class="n ${st.everSent?'done':''}">3</span><h3 style="margin:0">Update the client</h3></div>`;
  if(!st.routed)return `<section class="card">${head}<p class="faint">Opens once the issue is assigned.</p></section>`;
  const hs=eng.hypotheses(t.text,t.triage.category,t.minute),conf=st.cause!==null?hs[st.cause]:null;
  if(st.lane==='client')return `<section class="card">${head}<p class="wait">${esc(st.waiting)} Since ${esc(st.since)}.</p>
   <div class="row"><button class="ghost" id="replied">Client replied: back to my team</button><button class="primary" id="close" ${conf?'':'disabled'}>Close issue</button></div>${conf?'':'<p class="fine">Closing needs a confirmed cause.</p>'}</section>`;
  if(st.lane==='closed')return `<section class="card">${head}<p class="okmsg">Closed by the engineer.</p><div class="draft">${esc(eng.closureNote({category:t.triage.category,confirmed:conf,severity:t.sev,reports:t.reports}))}</div></section>`;
  const dr=eng.draftUpdate({reports:t.reports,severity:t.sev,category:t.triage.category,confirmed:conf,startedAt:t.time,approved:true});
  const text=st.next?dr.text.replace(/\[NEXT UPDATE TIME:[^\]]*\]/,'Next update by '+st.next+'.'):dr.text;
  const holes=(text.match(/\[[A-Z ]+:[^\]]*\]/g)||[]).length;
  return `<section class="card">${head}<div class="draft">${esc(text).replace(/\[[A-Z ]+:[^\]]*\]/g,m=>`<mark>${m}</mark>`)}</div>
  <div class="row"><label class="field">Next update by<input type="time" id="next" value="${esc(st.next)}"></label><span class="grow"></span><button class="primary" id="send" ${holes?'disabled':''}>Send update</button></div>
  <p class="fine">${holes?`Fill the ${holes} highlighted blank${holes>1?'s':''} first. TradeSentinel never guesses them.`:'Sending moves this issue to "With the client".'}</p></section>`;
}
function detail(){
  const t=cur();if(!t.st.opened)t.st.opened=Date.now();
  const r=t.triage,senior=t.st.lane==='team'&&(r.senior||t.sev==='S1');
  return `<div class="page"><button class="back" data-home="1">&larr; All issues</button>
  <div class="row">${pill(t.sev)}<span class="tag">${t.st.lane==='client'?'With the client':t.st.lane==='closed'?'Closed':'With your team'}</span><span class="faint small">${t.id} · ${esc(t.channel)} · ${esc(t.time)}</span></div>
  <h1 style="margin-top:12px">${esc(t.client)}</h1><p class="quote">“${esc(t.text)}”</p>
  ${senior?`<p class="alert">A senior engineer should review this: ${esc(r.seniorReasons.concat(t.sev==='S1'?['critical priority']:[]).join(', '))}.</p>`:''}
  <section class="card">${cfg.categories[r.category].level==='L0'?'<p class="muted">Shadow mode: the AI reading is hidden for this category.</p>':why(t)}
  ${t.reports>1?`<p class="small">${t.peers.length} reports look like the same fault (${t.peers.join(', ')}). ${t.st.merge?'<span class="okmsg">Merged.</span>':'<button class="ghost" id="merge">Merge them</button>'}</p>`:''}</section>
  ${stepAssign(t)}${stepCause(t)}${stepUpdate(t)}
  <details style="margin-top:22px"><summary>History and limits</summary><ul class="log">${S.audit.filter(a=>a.includes(t.id)).map(a=>`<li>${esc(a)}</li>`).join('')||'<li>No decisions yet.</li>'}</ul>
  <p class="fine" style="margin-top:10px">TradeSentinel can never lower a priority, close or merge an issue, change production, or send an update on its own.</p></details></div>`;
}
function rules(){
  const rows=Object.entries(cfg.categories).map(([k,c])=>`<tr><td>${esc(c.label)}</td><td>${esc(c.owner)}</td><td>${pill(c.floor_market)}</td><td><select data-level="${k}" aria-label="Automation for ${esc(c.label)}" ${c.held_reason?'disabled':''}>${['L0','L1','L2'].map(l=>`<option value="${l}" ${c.level===l?'selected':''}>${LEVEL[l]}</option>`).join('')}<option disabled>Limited auto (not earned)</option></select></td></tr>`).join('');
  return `<div class="page" style="max-width:900px"><h1>Rules</h1><p class="muted">How much TradeSentinel may do is a setting for each type of issue. Change one and go back to Issues to see the difference.</p>
  <section class="card"><div class="tw"><table><thead><tr><th>Type of issue</th><th>Team</th><th>Lowest priority in market hours</th><th>Automation</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="fine">Execution failures are held at Suggest on purpose: a miss there costs the most.</p>
  <label class="field">Send to a senior engineer below this confidence: <b id="thrv">${pc(cfg.confidence_threshold)}</b><input id="thr" type="range" min="0.3" max="0.9" step="0.05" value="${cfg.confidence_threshold}"></label></section>
  <details style="margin-top:22px"><summary>Reuse test: market data feed alerts (paper only)</summary><p class="small muted" style="margin-top:10px">The same rules, steps and approvals carry over. Two engine changes are needed: grouping alerts by feed and venue, and counting affected clients.</p><pre>${esc(JSON.stringify(PAPER,null,2))}</pre></details></div>`;
}
function results(){
  const R=HOLD,tr=R.severity.table;
  return `<div class="page" style="max-width:900px"><h1>Results</h1><p class="muted">${R.n} invented reports the system had not seen, tested once with settings frozen.</p>
  <div class="tiles" style="margin-top:18px"><div class="tile"><b>${R.category.accuracy}%</b><span>read correctly (keyword rules: ${R.category.baselineAccuracy}%)</span></div><div class="tile"><b>${tr[0].criticalRecall}%</b><span>critical issues escalated (AI alone: ${tr[1].criticalRecall}%)</span></div><div class="tile"><b>${R.rootCause.top3}%</b><span>true cause in the top three</span></div><div class="tile"><b>${R.severity.underS1S2.length}</b><span>critical issues rated too low</span></div></div>
  <section class="card"><h3>Where it failed</h3><div class="tw"><table><thead><tr><th>Report</th><th>Should be</th><th>Got</th></tr></thead><tbody>${R.severity.underS1S2.map(u=>`<tr><td>${esc(u.text)}</td><td>${pill(u.truth)}</td><td>${pill(u.got)}</td></tr>`).join('')}</tbody></table></div>
  <p class="small">Politely worded, understated reports are the weak spot. One author wrote the data and the tests, so these results are likely optimistic.</p></section>
  <details style="margin-top:22px"><summary>Payoff by approach</summary><div class="tw" style="margin-top:10px"><table><thead><tr><th>Approach</th><th>Critical escalated</th><th>Net USD per issue at 5% critical</th></tr></thead><tbody>${tr.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.criticalRecall}%</td><td>${x.netPayoffPerIssue['0.05']}</td></tr>`).join('')}</tbody></table></div><p class="fine">Payoffs are assumed values from the proposal.</p></details></div>`;
}
function render(){nav();document.getElementById('view').innerHTML=S.sel?detail():S.tab==='rules'?rules():S.tab==='results'?results():home();}
function refresh(){recompute();render()}
function routeNow(t,owner,sev,why){
  const changed=owner!==t.triage.owner||sev!==t.sev,secs=t.st.opened?Math.round((Date.now()-t.st.opened)/1000):0;
  Object.assign(t.st,{routed:true,owner,override:changed?why:null});
  if(sev!==t.sev){t.humanSev=sev;t.sev=sev}
  log(`${t.id} assigned to ${owner}, ${sev}${changed?' (changed: '+why+')':''}, review ${secs}s`);
}
function sendNow(t){const now=new Date().toTimeString().slice(0,5);Object.assign(t.st,{sent:true,everSent:true,lane:'client',since:t.st.next?now:now,waiting:'Update sent. Waiting for the client to confirm.'});log(`${t.id} update approved and sent (simulated)`)}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const t=cur();
  if(b.dataset.tab){S.tab=b.dataset.tab;S.sel=null;render();scrollTo(0,0);return}
  if(b.dataset.home){S.sel=null;render();return}
  if(b.dataset.t){S.sel=b.dataset.t;render();scrollTo(0,0);return}
  if(b.id==='merge'){t.peers.forEach(id=>{S.tickets.find(x=>x.id===id).st.merge=true});log(`${t.peers.join(', ')} merged by engineer (${t.id})`);render();return}
  if(b.id==='route'){
    const owner=document.getElementById('owner').value,sev=document.getElementById('sev').value,why=document.getElementById('why').value.trim(),err=document.getElementById('err');
    const changed=owner!==t.triage.owner||sev!==t.sev;
    if(!owner){err.hidden=false;err.textContent='Choose a team first.';return}
    if(changed&&!why&&t.triage.level!=='L0'){err.hidden=false;err.textContent='Add a short reason for the change.';return}
    routeNow(t,owner,sev,why);render();return}
  if(b.id==='fix'){t.st.fix=true;log(`${t.id} fix approved for the change process`);render();return}
  if(b.id==='send'){sendNow(t);render();return}
  if(b.id==='replied'){Object.assign(t.st,{lane:'team',sent:false,next:'',waiting:''});log(`${t.id} client replied; back with the team`);render();return}
  if(b.id==='close'){t.st.lane='closed';t.st.closed=true;log(`${t.id} closed by engineer`);render();return}
  if(b.id==='add'){const v=document.getElementById('newt').value.trim();if(!v)return;const last=S.tickets.reduce((a,x)=>Math.max(a,x.minute),0)+1,id='T-'+S.n++;
    S.tickets.push({id,text:v,client:'Your test report',channel:'Console',time:'now',minute:last,st:blank()});S.sel=id;refresh();return}
});
document.addEventListener('change',e=>{
  const el=e.target,t=cur();
  if(el.id==='mh'){refresh();return}
  if(el.dataset.level){cfg.categories[el.dataset.level].level=el.value;log(`Automation for ${cfg.categories[el.dataset.level].label} set to ${LEVEL[el.value]}`);refresh();return}
  if(el.dataset.cause!==undefined){t.st.cause=+el.dataset.cause;t.st.fix=false;log(`${t.id} cause confirmed by engineer`);render();return}
  if(el.id==='next'){t.st.next=el.value;render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='thr'){cfg.confidence_threshold=+e.target.value;document.getElementById('thrv').textContent=pc(cfg.confidence_threshold);recompute()}});
// Named views: #issues, #rules, #results, a ticket such as #T-1005, or #walk-T-1001 to replay a finished case for screenshots.
function fromHash(){
  const h=location.hash.slice(1),alias={control:'rules',evidence:'results',queue:'issues'};
  if(['issues','rules','results'].includes(alias[h]||h)){S.tab=alias[h]||h;S.sel=null}
  else if(/^T-\d+$/.test(h)&&S.tickets.some(x=>x.id===h))S.sel=h;
  else if(h.startsWith('walk-')){const id=h.slice(5),t=S.tickets.find(x=>x.id===id);if(t){S.sel=id;routeNow(t,t.triage.owner,t.sev,'');t.st.cause=0;t.st.fix=true;t.st.next='10:30';log(`${id} cause confirmed, fix approved (replayed)`)}}
}
recompute();fromHash();render();addEventListener('hashchange',()=>{fromHash();render()});
</script>
